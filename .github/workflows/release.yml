# Build the CDN-patched rclone and publish binaries as a GitHub release.
#
# Tag push (e.g. v1.75.0-cdn.1) -> build linux/amd64 + windows/amd64 and
# attach them to a release named after the tag. Plain pushes to main run the
# same pipeline as a smoke test (unit tests + artifacts only).

name: Build & Release

on:
  push:
    branches: [main]
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Backend unit tests first - fail fast before burning build time.
      # Includes the download_host/head-via-CDN presigned-path tests.
      - name: Test backend/s3
        run: go test ./backend/s3/

      - name: Build linux/amd64
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w -X github.com/rclone/rclone/fs.Version=${VERSION}" \
            -o dist/rclone-cdn-linux-amd64

      - name: Build windows/amd64
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w -X github.com/rclone/rclone/fs.Version=${VERSION}" \
            -o dist/rclone-cdn-windows-amd64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: rclone-cdn-binaries
          path: dist/
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/rclone-cdn-linux-amd64
            dist/rclone-cdn-windows-amd64.exe
          generate_release_notes: true
